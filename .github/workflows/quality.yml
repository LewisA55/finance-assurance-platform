name: v0.1 quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check public release boundary
        run: python scripts/check_public_release.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Python tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
      - name: Prepare verified DuckDB-Wasm runtime
        run: npm run prepare:duckdb
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Finance runtime tests
        run: npm run test:finance
      - name: Production build and rendered-route tests
        run: npm test

  browser-journeys:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked product environments
        working-directory: .
        run: uv sync --locked --dev
      - name: Install locked web dependencies
        run: npm ci
      - name: Install verified Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Prepare verified browser-local finance runtime
        run: npm run prepare:duckdb
      - name: Run critical browser journeys
        run: npm run test:e2e
