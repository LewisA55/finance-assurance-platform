version: 2

models:
  - name: dim_bank_account
    description: Conformed treasury bank-account dimension.
    columns:
      - name: bank_account_hk
        data_tests: [not_null, unique]
      - name: bank_account_id
        data_tests: [not_null, unique]
  - name: dim_debt_instrument
    description: Conformed debt-facility and instrument dimension.
    columns:
      - name: debt_instrument_hk
        data_tests: [not_null, unique]
      - name: debt_instrument_id
        data_tests: [not_null, unique]
  - name: dim_fixed_asset
    description: Fixed and intangible asset master with acquisition-event lineage.
    columns:
      - name: fixed_asset_hk
        data_tests: [not_null, unique]
      - name: asset_id
        data_tests: [not_null, unique]
  - name: dim_lease_contract
