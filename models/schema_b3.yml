      - name: payroll_line_id
        data_tests: [not_null, unique]
  - name: fct_employee_compensation
    description: Payroll components inheriting the governed payroll-line accounting lineage.
    columns:
      - name: employee_compensation_hk
        data_tests: [not_null, unique]
      - name: compensation_line_id
        data_tests: [not_null, unique]
  - name: fct_headcount_monthly_snapshot
    description: Monthly employee state, FTE and annualised salary snapshot.
    columns:
      - name: headcount_monthly_snapshot_hk
        data_tests: [not_null, unique]
  - name: fct_ar_ageing_daily
    description: Full daily open-invoice state with customer and accounting lineage.
    columns:
      - name: ar_ageing_daily_hk
        data_tests: [not_null, unique]
  - name: fct_ap_ageing_daily
    description: Full daily open-vendor-invoice state with supplier and accounting lineage.
    columns:
      - name: ap_ageing_daily_hk
        data_tests: [not_null, unique]
  - name: fct_subscription_monthly_state
