        data_tests: [not_null, unique]
  - name: q_finance_v3_dataset_registry
    description: Closed Q-FINANCE v3 dataset registry preserving B1 and B2.
    columns:
      - name: dataset_id
        data_tests: [not_null, unique]
  - name: q_finance_v3_relationship_registry
    description: Tool-neutral relationship catalogue for Q-FINANCE v3.
    columns:
      - name: relationship_id
        data_tests: [not_null, unique]
  - name: q_finance_v3_measure_registry
    description: Tool-neutral governed operational-finance measure specifications.
    columns:
      - name: measure_id
        data_tests: [not_null, unique]
  - name: q_finance_v3_lineage_registry
    description: Complete A2.4 to Silver to Gold lineage catalogue for Q-FINANCE v3.
    columns:
      - name: dataset_id
        data_tests: [not_null, unique]
