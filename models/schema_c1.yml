      - name: cfo_metric_readiness_hk
        data_tests: [not_null, unique]
  - name: mart_executive_cfo_command_center
    description: One governed group-level monthly command-centre row for React and BI.
    columns:
      - name: executive_cfo_command_center_hk
        data_tests: [not_null, unique]
  - name: mart_model_actuals_feed
    description: Account-level monthly statutory actuals with exact reporting version.
    columns:
      - name: model_actuals_feed_hk
        data_tests: [not_null, unique]
  - name: mart_model_working_capital_drivers
    description: Monthly revenue and working-capital drivers for authored financial models.
    columns:
      - name: model_working_capital_driver_hk
        data_tests: [not_null, unique]
  - name: mart_model_capital_schedules
    description: Normalised fixed asset, debt, lease, tax, and equity schedules with domain labels.
    columns:
