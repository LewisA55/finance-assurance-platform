      - name: model_planning_input_hk
        data_tests: [not_null, unique]
  - name: mart_model_readiness_controls
    description: Current-state validators for history, reconciliation, subledgers, and planning boundaries.
    columns:
      - name: model_readiness_control_hk
        data_tests: [not_null, unique]
  - name: q_finance_v5_dataset_registry
    description: Q-FINANCE v5 closed inventory including the 21 C1 marts.
    columns:
      - name: dataset_id
        data_tests: [not_null, unique]
  - name: q_finance_v5_relationship_registry
    description: Q-FINANCE v5 tool-neutral relationships for atomic and mart datasets.
    columns:
      - name: relationship_id
        data_tests: [not_null, unique]
  - name: q_finance_v5_measure_registry
    description: Q-FINANCE v5 governed measure definitions for executive and model consumption.
    columns:
      - name: measure_id
        data_tests: [not_null, unique]
  - name: q_finance_v5_lineage_registry
    description: Q-FINANCE v5 A2.4-to-atomic-to-mart lineage catalogue.
    columns:
      - name: dataset_id
        data_tests: [not_null, unique]
